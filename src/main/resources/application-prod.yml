server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: user-service
  datasource:
#    url: jdbc:postgresql://${POSTGRES_HOST:ep-dry-flower-a1e2sv79-pooler.ap-southeast-1.aws.neon.tech}:${POSTGRES_PORT:5432}/${POSTGRES_DB:neondb}?sslmode=${PGSSLMODE:require}&sslchannelbinding=${PGCHANNELBINDING:require}
#    driver-class-name: org.postgresql.Driver
#    username: ${POSTGRES_USER:neondb_owner}
#    password: ${POSTGRES_PASSWORD:npg_MLKJPNA8nEu2}
    url: ${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:busbooking}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: user_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown

# ── MinIO Configuration ────────────────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:busapp-profiles}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# Provide base64-encoded DER keys (generated by ./generate-keys.sh).
# Leave blank to auto-generate ephemeral keys (development only).
jwt:

  private-key: ${JWT_PRIVATE_KEY}
  public-key:  ${JWT_PUBLIC_KEY}
  access-token-expiry:  ${JWT_ACCESS_EXPIRY:900000}     # 15 minutes in ms
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days in ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_BASE_URL}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

# Service URLs
booking:
  service:
    url: ${BUS_SERVICE_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.busapp.userservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE